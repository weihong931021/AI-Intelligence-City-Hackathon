[project]
name = "landlens-backend"
version = "0.1.0"
description = "LandLens FastAPI backend (dev.md §6.1): chat endpoint streaming Bedrock via SSE"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "boto3>=1.35",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
